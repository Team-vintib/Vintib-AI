# MR(Merge Request) 시점에만 동작하는 검증 전용 CI.
# 배포(CD)는 포함하지 않음. 기술 스택은 아직 미확정 상태이므로,
# 여기 적힌 이미지/버전은 "지금 각 파트 빌드 설정 파일(build.gradle,
# package.json, requirements.txt)에 실제로 pin된 값"을 그대로 반영한 것.
# 스택이 최종 확정/변경되면 해당 파트의 build 설정 파일과 함께
# 아래 image 태그만 맞춰서 갱신하면 됨.

stages:
  - test
  - deploy

workflow:
  rules:
    # MR 검증
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # develop-BE 병합 시 자동 배포 (-262)
    - if: '$CI_COMMIT_BRANCH == "develop-BE"'

variables:
  GIT_DEPTH: "1"

# ---------- BE (Java 21 / Spring Boot 4.1.0 / Gradle) ----------
be-test:
  stage: test
  image: eclipse-temurin:21-jdk-jammy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "BE/**/*"
  services:
    # docker-compose.yml과 동일 버전. application.yml이 DB_HOST/REDIS_HOST 등을
    # 환경변수로 읽으므로, @SpringBootTest가 실제 컨테이너에 붙어 동작함.
    #
    # ⚠️ alias 를 이미지 이름(postgres/redis)과 같게 두면 러너가 자동 생성하는
    #    별칭과 충돌해 "alias is already in use" 로 skip 되고, 그 결과 호스트명이
    #    해석되지 않아 DB 연결이 실패한다. 충돌하지 않는 이름을 쓴다.
    - name: postgres:18-alpine
      alias: db
    - name: redis:8.8-alpine
      alias: cache
  variables:
    # ⚠️ 여기 값들은 프로젝트 CI/CD Variables 에 같은 이름이 있으면 그쪽으로 덮어써진다
    #    (GitLab 우선순위: 프로젝트 변수 > .gitlab-ci.yml job 변수).
    #    운영 비밀번호는 PROD_DB_PASSWORD 처럼 겹치지 않는 이름을 쓴다.
    POSTGRES_DB: vintage_auction
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: vintage_auction
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_HOST: cache
    REDIS_PORT: "6379"
  cache:
    key: "be-gradle-${CI_COMMIT_REF_SLUG}"
    paths:
      - BE/.gradle/
  before_script:
    - cd BE
    - chmod +x gradlew
    # 서비스 준비 확인. 여기서 끊으면 원인이 "DB 연결"임이 분명해진다.
    # (없으면 Hibernate 가 dialect 결정 실패로 죽어 원인 파악이 어렵다)
    # ⚠️ 콜론+공백이 든 명령은 반드시 따옴표로 감싼다. 안 그러면 YAML 이 맵으로 파싱해
    #    GitLab 이 설정을 거부하고 잡이 실행조차 되지 않는다.
    - 'getent hosts "$DB_HOST" || { echo "DNS 해석 실패 - $DB_HOST"; exit 1; }'
    - 'timeout 30 bash -c "until (echo > /dev/tcp/$DB_HOST/$DB_PORT) 2>/dev/null; do sleep 1; done" || { echo "TCP 연결 실패 - $DB_HOST:$DB_PORT"; exit 1; }'
    - 'timeout 30 bash -c "until (echo > /dev/tcp/$REDIS_HOST/$REDIS_PORT) 2>/dev/null; do sleep 1; done" || { echo "TCP 연결 실패 - $REDIS_HOST:$REDIS_PORT"; exit 1; }'
  script:
    - ./gradlew build --no-daemon --build-cache -Dgradle.user.home=.gradle

# ---------- FE (Vue 3.5 / Vite / TypeScript) ----------
fe-test:
  stage: test
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "FE/**/*"
  cache:
    key: "fe-npm-${CI_COMMIT_REF_SLUG}"
    paths:
      - FE/node_modules/
  before_script:
    - cd FE
    # package-lock.json이 아직 커밋되어 있지 않아 npm ci 대신 npm install 사용.
    # 락파일이 생기면 npm ci로 바꿔서 재현 가능한 설치로 전환할 것.
    - npm install
  script:
    - npm run lint
    - npm run type-check
    # 유닛 테스트 프레임워크(vitest 등)가 아직 설치되어 있지 않아
    # lint + type-check + build를 현재 시점의 검증 게이트로 사용.
    # 테스트 프레임워크 도입 시 여기에 test 스크립트 추가.
    - npm run build

# ---------- AI (Python 3.12 / FastAPI) ----------
ai-test:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "AI/**/*"
  cache:
    key: "ai-pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - AI/.cache/pip
  before_script:
    - cd AI
    - pip install --cache-dir .cache/pip -r requirements-dev.txt
  script:
    - ruff check .
    - black --check .
    # AI/에 아직 tests/ 디렉터리가 없어 pytest가 "no tests collected"(exit 5)를
    # 반환함. 테스트가 추가되기 전까지는 이를 정상으로 처리하고,
    # 그 외 실패(코드/의존성 문제 등)는 그대로 파이프라인을 실패시킴.
    - >
      pytest -q || code=$?; if [ "${code:-0}" -eq 5 ]; then
        echo "No tests collected yet under AI/ - skipping as pass.";
      elif [ "${code:-0}" -ne 0 ]; then
        exit "${code}";
      fi

# ---------- 배포 (develop-BE 병합 시 EC2 자동 배포) ----------
# 전용 러너(tag: deploy)에서만 실행된다. 그 러너에만 호스트 docker.sock 과
# 배포 디렉터리가 마운트되어 있어, 일반 테스트 잡은 호스트 도커에 접근하지 못한다.
#
# 필요한 CI/CD Variables (Settings → CI/CD → Variables):
#   PROD_DB_PASSWORD  운영 DB 비밀번호. Masked 권장.
#                ⚠️ 이름을 DB_PASSWORD 로 두면 be-test 의 테스트용 DB_PASSWORD 까지
#                   덮어써서 테스트가 인증 실패한다(프로젝트 변수가 우선).
#                ⚠️ EC2 PostgreSQL 볼륨을 처음 만들 때 쓴 값과 반드시 같아야 한다.
#                ⚠️ "Protected" 로 두려면 develop-BE 도 protected 브랜치여야 한다.
deploy:
  stage: deploy
  image: docker:cli
  tags:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop-BE"'
  variables:
    # 커밋 SHA 로 이미지를 태깅해 롤백 시 직전 태그를 되살릴 수 있게 한다.
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    DB_NAME: vintage_auction
    DB_USERNAME: postgres
  before_script:
    # docker:cli 에 compose 플러그인·rsync 가 없을 수 있어 명시적으로 설치한다.
    - apk add --no-cache rsync docker-cli-compose
  script:
    - sh infra/ci/deploy.sh
  environment:
    name: production
    url: https://i15a108.p.ssafy.io
