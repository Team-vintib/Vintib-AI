<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Vintib AI — 빈티지 의류 라이브 경매를 위한 AI 서비스">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d2a"/>
      <stop offset="1" stop-color="#262033"/>
    </linearGradient>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ffffff" stroke-opacity="0.035" stroke-width="6"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="22" fill="url(#weave)"/>

  <!-- 좌측 타이틀 -->
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
    <text x="80" y="104" fill="#e8a54b" font-size="17" font-weight="700" letter-spacing="4">SSAFY 15 · AI PART</text>
    <text x="76" y="200" fill="#f4efe6" font-family="Georgia,'Times New Roman',serif" font-size="96" font-weight="700" letter-spacing="-2">Vintib AI</text>
    <text x="80" y="252" fill="#c9c3d6" font-size="26" font-weight="500">빈티지 의류 라이브 경매를 위한 AI 서비스</text>

    <!-- 기능 칩 -->
    <g font-size="17" font-weight="600">
      <g transform="translate(80 300)">
        <rect width="108" height="38" rx="19" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.22"/>
        <text x="54" y="25" fill="#f4efe6" text-anchor="middle">상품 분류</text>
      </g>
      <g transform="translate(198 300)">
        <rect width="108" height="38" rx="19" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.22"/>
        <text x="54" y="25" fill="#f4efe6" text-anchor="middle">하자 검수</text>
      </g>
      <g transform="translate(316 300)">
        <rect width="108" height="38" rx="19" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.22"/>
        <text x="54" y="25" fill="#f4efe6" text-anchor="middle">시세 추정</text>
      </g>
      <g transform="translate(434 300)">
        <rect width="108" height="38" rx="19" fill="#e8a54b" fill-opacity="0.16" stroke="#e8a54b" stroke-opacity="0.7"/>
        <text x="54" y="25" fill="#f3c37f" text-anchor="middle">가상 시착</text>
      </g>
      <g transform="translate(552 300)">
        <rect width="108" height="38" rx="19" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.22"/>
        <text x="54" y="25" fill="#f4efe6" text-anchor="middle">채팅 판정</text>
      </g>
      <g transform="translate(670 300)">
        <rect width="108" height="38" rx="19" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.22"/>
        <text x="54" y="25" fill="#f4efe6" text-anchor="middle">RAG 답변</text>
      </g>
    </g>
  </g>

  <!-- 우측 행택(가격표) -->
  <g transform="translate(990 70) rotate(8)" filter="url(#shadow)">
    <path d="M18 0 C 80 -40, 150 -30, 170 -70" fill="none" stroke="#c9b48f" stroke-width="2.5"/>
    <path d="M40 0 H170 a16 16 0 0 1 16 16 V262 a16 16 0 0 1 -16 16 H16 a16 16 0 0 1 -16 -16 V40 Z" fill="#f1e7d6"/>
    <circle cx="30" cy="30" r="9" fill="#1f1d2a"/>
    <circle cx="30" cy="30" r="9" fill="none" stroke="#c9b48f" stroke-width="3"/>
    <g font-family="'Courier New',ui-monospace,monospace" fill="#2a2433">
      <text x="56" y="74" font-size="15" letter-spacing="2" opacity="0.7">LOT No.</text>
      <text x="56" y="112" font-size="38" font-weight="700">VTB-01</text>
      <line x1="24" y1="134" x2="162" y2="134" stroke="#2a2433" stroke-opacity="0.25" stroke-dasharray="4 5"/>
      <text x="24" y="166" font-size="14" letter-spacing="1" opacity="0.75">CATEGORY  OUTER</text>
      <text x="24" y="190" font-size="14" letter-spacing="1" opacity="0.75">CONDITION A-</text>
      <text x="24" y="214" font-size="14" letter-spacing="1" opacity="0.75">DEFECT    1</text>
    </g>
    <g transform="translate(96 240) rotate(-12)">
      <rect x="-60" y="-18" width="120" height="32" rx="6" fill="none" stroke="#c4473a" stroke-width="2.5"/>
      <text x="0" y="5" fill="#c4473a" font-family="'Courier New',ui-monospace,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">AI INSPECTED</text>
    </g>
  </g>
</svg>
