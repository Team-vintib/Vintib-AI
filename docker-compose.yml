# 베이스 정의 — 운영(EC2) 기준으로 안전한 기본값을 담는다.
#
# ⚠️ 이 파일에는 호스트 포트 publish를 절대 추가하지 않는다.
#    Docker는 포트 publish 시 iptables를 직접 조작해 UFW를 우회하므로,
#    여기에 ports를 적으면 PostgreSQL·Redis·FastAPI가 그대로 외부에 노출된다.
#
# 로컬 개발 : docker compose up -d
#             → docker-compose.override.yml 이 자동 병합되어 개발용 포트가 열린다.
# EC2 운영  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#             → override 를 타지 않도록 반드시 -f 를 명시한다.

services:
  postgres:
    image: postgres:18-alpine
    container_name: vintib-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=1GB"]
    environment:
      POSTGRES_DB: ${DB_NAME:-vintib}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # PostgreSQL 18부터 마운트 지점이 /var/lib/postgresql/data → /var/lib/postgresql 로 바뀌었다.
      # 이미지가 메이저 버전별 하위 디렉터리(/var/lib/postgresql/18/docker)를 직접 관리하며,
      # 예전 경로에 마운트하면 기동 자체가 실패한다.
      - postgres-data:/var/lib/postgresql
    networks:
      - vintib-net
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-vintib}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    container_name: vintib-redis
    restart: unless-stopped
    # noeviction 필수 — 입찰 분산락·포인트 보류 상태가 메모리 압박으로 유실되면 안 된다.
    command:
      - redis-server
      - --maxmemory
      - 768mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    networks:
      - vintib-net
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 호환 오브젝트 스토리지. 팀에 AWS 계정이 없어(SSAFY 제공 EC2 한 대, 콘솔 없음)
  # 운영에서도 실제 S3 대신 이 컨테이너를 쓴다 — 계획 JY006 참고.
  # 외부 노출은 caddy 가 /vintib-public·/vintib-private 경로를 프록시해서만 이뤄진다.
  minio:
    # 다른 서비스와 같은 이유로 버전을 고정한다. latest 를 따라가면 운영 재배포 때
    # 볼륨 포맷이나 정책 API 가 바뀌어도 알아채지 못한다.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vintib-minio
    restart: unless-stopped
    environment:
      # ⚠️ Postgres 와 같은 함정 — 이 자격증명은 볼륨을 처음 만들 때의 값으로 굳는다.
      #    나중에 바꾸려면 minio-data 볼륨을 지워야 한다(= 업로드된 이미지 전부 소멸).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - vintib-net
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./BE
    image: vintib-backend:${IMAGE_TAG:-local}
    container_name: vintib-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vintib}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_BASE_URL: http://ai:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_PUBLIC_BUCKET: ${AWS_S3_PUBLIC_BUCKET:-vintib-public}
      AWS_S3_PRIVATE_BUCKET: ${AWS_S3_PRIVATE_BUCKET:-vintib-private}
      # 스토리지가 MinIO 라 자격증명도 MinIO root 를 그대로 쓴다. minio 서비스와 같은
      # 변수에서 파생시켜 둘이 어긋날 수 없게 한다 — 어긋나면 서명 검증이 통째로 실패한다.
      # (훗날 실제 AWS S3 로 옮기면 이 두 줄만 별도 변수로 분리하면 된다)
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # 백엔드 자신의 호출(HeadObject 등)은 컨테이너 네트워크로 직접 간다.
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      # presigned·공개 URL 은 브라우저가 여는 것이라 외부에서 닿는 주소여야 한다.
      # local 은 override.yml 이, 운영은 deploy.sh 가 .env 로 채운다.
      AWS_S3_PUBLIC_ENDPOINT: ${AWS_S3_PUBLIC_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vintib-net
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  ai:
    build:
      context: ./AI
    image: vintib-ai:${IMAGE_TAG:-local}
    container_name: vintib-ai
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vintib}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WORKER_API_KEY: ${WORKER_API_KEY}
      PUBLIC_BASE_URL: https://i15a108.p.ssafy.io
      RESULTS_DIR: /app/results
    volumes:
      - results-data:/app/results                                      
    networks:
      - vintib-net
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  vintib-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  results-data:
