# OpenVidu v3 미디어 코어(LiveKit) 서버 설정 — S15P11A108-448
#
# ⚠️ API key/secret 은 여기 두지 않는다. LIVEKIT_KEYS 환경변수로 주입한다(.env).
#    설정 파일은 리포지토리에 커밋되므로 비밀값이 들어가면 안 된다.

# 시그널링·서버 API 용 HTTP 포트. 호스트에 열지 않고 Caddy 가 /rtc·/twirp 만 프록시한다.
port: 7880

rtc:
  # ── 미디어 포트를 단일 포트로 묶는다(UDP mux) ─────────────────────────────
  # 기본값은 50000-60000 범위인데, 그러면 UFW 에 만 개짜리 규칙을 열어야 하고
  # 도커 publish 도 그만큼 느려진다(포트마다 프록시 규칙이 생긴다).
  # mux 를 쓰면 UDP 한 개로 끝난다. 동시 접속 수백 명 규모에서는 차이가 없다.
  udp_port: 7885
  # UDP 가 막힌 망(사내 방화벽 등)을 위한 TCP 폴백. 없으면 그런 시청자는 영상이 안 뜬다.
  tcp_port: 7881
  # ── 클라이언트에 알릴 IP 를 어떻게 정하는가 ────────────────────────────────
  #
  # 여기서는 끈다(false). 켜면 LiveKit 이 기동 시 STUN 서버로 공인 IP 를 물어보는데,
  # 외부 UDP 가 막힌 환경에서는 그 조회가 타임아웃되고 **서버가 아예 뜨지 않는다**
  # ("could not resolve external IP"). 로컬 개발이 통째로 막히므로 기본값으로 둘 수 없다.
  #
  # 운영(EC2)에서는 컨테이너가 보는 IP 가 사설 주소라 그대로 쓰면 외부에서 연결되지 않는다.
  # 그래서 docker-compose.prod.yml 이 NODE_IP 환경변수로 **공인 IP 를 직접 알려준다.**
  # STUN 조회 없이 정확한 값을 주는 쪽이 빠르고 실패 지점도 없다.
  use_external_ip: false

room:
  # 방을 미리 만들지 않는다 — 첫 참가자가 들어올 때 자동 생성된다.
  # 백엔드는 방송 시작 시 이름만 정해 둔다(LiveVideoService.newRoomName).
  auto_create: true
  # 아무도 없는 방을 정리하기까지의 시간(초). 방송 종료 시 백엔드가 명시적으로 지우지만,
  # 그 호출이 실패해도 여기서 스스로 사라진다.
  empty_timeout: 300
  # 송출자가 나간 뒤 방을 유지하는 시간(초). 호스트 네트워크가 잠깐 끊겨도 방이 살아 있어야
  # 시청자가 그대로 붙어 있는다.
  departure_timeout: 60

logging:
  level: info
  # JSON 로그는 사람이 읽기 어렵다. 단일 노드라 로그 수집기도 없다.
  json: false

# 내장 TURN 은 끈다. 443/80 을 요구해 Caddy 와 정면 충돌하고, tcp_port 폴백으로
# 대부분의 제한 망은 이미 커버된다.
turn:
  enabled: false
