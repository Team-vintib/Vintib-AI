spring:
  jpa:
    hibernate:
      # 엔티티 변경분만 반영하고 **데이터는 유지한다.** create 는 매 재배포마다 스키마를
      # 통째로 다시 만들어 운영 데이터가 전부 날아갔다 — 시연·QA 중 쌓인 상품·주문이
      # 재배포 한 번에 사라지므로 더는 쓸 수 없다.
      #
      # ⚠️ update 가 못 하는 것을 알고 써야 한다. 스키마가 조용히 어긋나는 지점들이다.
      #    - 컬럼·테이블을 **지우지 않는다**. 엔티티에서 필드를 빼도 DB 에는 남는다
      #    - 컬럼 타입·길이를 **바꾸지 않는다**(넓히는 것도 포함)
      #    - 행이 있는 테이블에 NOT NULL 컬럼을 추가하면 **실패한다.** 그런데 Hibernate 는
      #      기동을 막지 않고 로그만 남기므로, 컬럼 없는 채로 떠서 런타임에 터진다.
      #      → 새 필드는 nullable 로 넣거나, 배포 전에 ALTER 를 직접 친다
      #
      # 스키마가 굳으면 validate + 마이그레이션 도구(Flyway 등)로 넘어간다.
      ddl-auto: update
    show-sql: false

springdoc:
  # FE 가 API 명세를 확인할 수 있도록 운영에서도 노출한다.
  # 서버가 1대뿐이라 FE 가 참조할 별도 개발 서버가 없다.
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: info
    com.ssafy.backend: info

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 컨테이너 healthcheck 용도로만 노출. 내부 구성 정보는 숨긴다.
      show-details: never