spring:
  jpa:
    hibernate:
      # MVP 개발 중에는 스키마를 매 기동마다 새로 만든다(기존 데이터는 유지되지 않는다).
      # 개발이 안정되면 validate 로 전환한다.
      ddl-auto: create
    show-sql: false

springdoc:
  # FE 가 API 명세를 확인할 수 있도록 운영에서도 노출한다.
  # 서버가 1대뿐이라 FE 가 참조할 별도 개발 서버가 없다.
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: info
    com.ssafy.backend: info

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # 컨테이너 healthcheck 용도로만 노출. 내부 구성 정보는 숨긴다.
      show-details: never