spring:
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vintib}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-change-in-prod-0123456789}
  access-token-validity: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15분(ms)
  refresh-token-validity: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000} # 14일(ms)

server:
  port: ${SERVER_PORT:8080}
  # Caddy가 TLS를 종단하고 backend에는 평문 HTTP로 넘긴다. 이 설정이 없으면
  # Spring이 요청을 그냥 http로 인식해 springdoc이 서버 URL을 http://로 잡고,
  # 그 결과 https로 열린 Swagger UI에서 "Execute"가 스킴이 다른(=교차 출처) 요청이
  # 되어 CORS/mixed-content로 막힌다. Caddy가 보내는 X-Forwarded-* 를 신뢰해
  # 실제 스킴(https)을 인식하도록 한다.
  forward-headers-strategy: framework

management:
  health:
    # 메일 서버(SMTP) 도달 여부는 "이 인스턴스가 트래픽을 처리할 수 있는가"의 기준이 아니다.
    # 이 지표를 켜두면 MAIL_USERNAME/PASSWORD 미설정 시 mail 이 DOWN 이 되어 /actuator/health 가
    # 503 을 반환하고, 그 결과 컨테이너 healthcheck 가 실패해 배포 자체가 막힌다(자격증명이 있어도
    # Gmail 장애 시 같은 문제). 배포 게이트에서 제외한다. 메일 상태 확인이 필요하면 발송 경로에서 다룬다.
    mail:
      enabled: false

# Spring 은 FastAPI 만 바라본다. 추론용 노트북 연결은 AI 팀 영역.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  connect-timeout: 2s
  read-timeout: 5s

cors:
  # FE 로컬 개발 서버(vite, 기본 포트 5173) 기준. 배포 환경은 CORS_ALLOWED_ORIGINS 로 덮어쓴다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID:}
  secret-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    # local(MinIO)만 채운다. prod는 비워서 AWS 기본 리졸버(virtual-hosted style)를 그대로 쓴다.
    endpoint: ${AWS_S3_ENDPOINT:}
    # 브라우저가 여는 presigned URL/공개 URL용. 비우면 endpoint를 그대로 쓴다 — docker-compose로
    # 백엔드까지 컨테이너로 띄울 때만 endpoint(minio:9000, 컨테이너 네트워크)와
    # public-endpoint(localhost:9000, 호스트 발행 포트)가 달라진다.
    public-endpoint: ${AWS_S3_PUBLIC_ENDPOINT:}
    public-bucket: ${AWS_S3_PUBLIC_BUCKET:vintib-public}
    private-bucket: ${AWS_S3_PRIVATE_BUCKET:vintib-private}