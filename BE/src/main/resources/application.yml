spring:
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vintib}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-change-in-prod-0123456789}
  access-token-validity: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15분(ms)
  refresh-token-validity: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000} # 14일(ms)

server:
  port: ${SERVER_PORT:8080}

# Spring 은 FastAPI 만 바라본다. 추론용 노트북 연결은 AI 팀 영역.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  connect-timeout: 2s
  read-timeout: 5s