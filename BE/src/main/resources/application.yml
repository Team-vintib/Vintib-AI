spring:
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vintib}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-key-please-change-in-prod-0123456789}
  access-token-validity: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15분(ms)
  refresh-token-validity: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000} # 14일(ms)

server:
  port: ${SERVER_PORT:8080}

management:
  health:
    # 메일 서버(SMTP) 도달 여부는 "이 인스턴스가 트래픽을 처리할 수 있는가"의 기준이 아니다.
    # 이 지표를 켜두면 MAIL_USERNAME/PASSWORD 미설정 시 mail 이 DOWN 이 되어 /actuator/health 가
    # 503 을 반환하고, 그 결과 컨테이너 healthcheck 가 실패해 배포 자체가 막힌다(자격증명이 있어도
    # Gmail 장애 시 같은 문제). 배포 게이트에서 제외한다. 메일 상태 확인이 필요하면 발송 경로에서 다룬다.
    mail:
      enabled: false

# Spring 은 FastAPI 만 바라본다. 추론용 노트북 연결은 AI 팀 영역.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  connect-timeout: 2s
  read-timeout: 5s

cors:
  # FE 로컬 개발 서버(vite, 기본 포트 5173) 기준. 배포 환경은 CORS_ALLOWED_ORIGINS 로 덮어쓴다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}