# FE 정적 서빙 설정 (Caddy 뒤 frontend 컨테이너).
# 계획: docs/plans/FE/HS020-fe-deploy.md
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 압축은 앞단 Caddy(encode zstd gzip)가 담당한다. 여기서 또 켜면 이중 압축이라 CPU 낭비.
    gzip off;

    # 헬스체크 — compose 의 frontend healthcheck 가 이 경로로 200 을 확인한다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 해시가 붙은 정적 자산(js/css)은 파일명이 바뀌면 새로 받으므로 길게 캐시한다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 캐시하지 않는다. 안 그러면 새로 배포해도 사용자가 옛 SPA 를 계속 쓴다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — 실제 파일이 없으면 index.html 로 넘긴다.
    # 이게 없으면 /lives/123 같은 경로의 새로고침·딥링크가 전부 404 가 된다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
