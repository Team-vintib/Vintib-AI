# 로컬 개발 전용 — `docker compose up -d` 시 자동 병합된다.
#
# 여기서만 호스트 포트를 연다. IDE에서 DB 클라이언트를 붙이거나
# Spring 을 컨테이너 밖(로컬 JVM)에서 띄워 붙일 수 있게 하기 위함이다.
#
# ⚠️ EC2 에서는 이 파일이 병합되면 안 된다.
#    운영 기동은 반드시 아래 형태로 -f 를 명시한다.
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    ports:
      - "${DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # 백엔드 컨테이너 자신의 S3 직접 호출(HeadObject 등)은 컨테이너 네트워크 주소를 쓴다.
      AWS_S3_ENDPOINT: http://minio:9000
      # presigned URL은 브라우저/FE가 여는 것이라 호스트에 발행된 포트를 가리켜야 한다.
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      minio:
        condition: service_healthy

  ai:
    ports:
      - "${AI_PORT:-8000}:8000"

  # 로컬 전용 S3 호환 스토리지. prod는 실제 AWS S3를 쓰므로 base(docker-compose.yml)가 아니라
  # 여기(override)에만 정의한다 — prod 기동(`-f docker-compose.yml -f docker-compose.prod.yml`)에는
  # 이 파일이 섞이지 않으므로 minio 컨테이너도 뜨지 않는다.
  minio:
    image: minio/minio
    container_name: vintib-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - vintib-net
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio-data: