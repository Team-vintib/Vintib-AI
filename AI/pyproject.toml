[project]
name = "ai"
version = "0.0.1"
description = "Vintage secondhand clothing live auction platform AI service"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
"test/AI_tryon/tryondiffusion",
"test/AI_tryon/catvton",
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["E402", "BLE001", "F401"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
  test/AI_tryon/tryondiffusion
  | test/AI_tryon/catvton
)
'''

[tool.pytest.ini_options]
norecursedirs = [
    "test/AI_tryon/catvton/densepose",
    "test/AI_tryon/catvton/detectron2",
]
