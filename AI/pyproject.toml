[project]
name = "ai"
version = "0.0.1"
description = "Vintage secondhand clothing live auction platform AI service"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
"test/AI_tryon/tryondiffusion",
"test/AI_tryon/catvton",
"test/**/*.ipynb",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
# AI/ 를 import 경로에 추가해 `pytest` 실행 시 `import app...` 가 해석되게 한다.
pythonpath = ["."]
