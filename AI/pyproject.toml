[project]
name = "ai"
version = "0.0.1"
description = "Vintage secondhand clothing live auction platform AI service"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# 외부/서드파티 코드라 lint 대상이 아니다(PoC로 통째로 가져온 것).
extend-exclude = [
"validation/AI_tryon/tryondiffusion",
"validation/AI_tryon/CatVTON",
]

[tool.ruff.lint.per-file-ignores]
# PoC·스파이크 코드에만 완화를 적용한다. `test/`(실제 테스트)는 프로덕션과 같은 기준으로 본다 —
# 여기에 test/**를 같이 넣으면 테스트 코드의 미사용 import·잘못된 import 순서가 그냥 통과한다.
"validation/**" = ["E402", "BLE001", "F401"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
  validation/AI_tryon/tryondiffusion
  | validation/AI_tryon/CatVTON
)
'''

[tool.pytest.ini_options]
pythonpath = ["."]