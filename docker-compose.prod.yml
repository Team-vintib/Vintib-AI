# EC2(i15a108.p.ssafy.io) 운영 전용.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# backend 만 루프백(127.0.0.1)에 바인딩한다.
#   - 호스트의 리버스 프록시(OpenVidu v3 내장 Caddy 등)가 TLS 종단 후 여기로 프록시한다.
#   - 0.0.0.0 이 아닌 127.0.0.1 바인딩이므로 Docker 의 UFW 우회 문제가 발생하지 않는다.
# postgres / redis / ai 는 어떤 포트도 열지 않는다 (vintib-net 내부 통신 전용).

services:
  backend:
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ai:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
