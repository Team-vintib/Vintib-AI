# EC2(i15a108.p.ssafy.io) 운영 전용.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 외부에 노출되는 것은 caddy(80/443) 뿐이다.
#   - caddy 가 TLS 종단(Let's Encrypt) 후 vintib-net 내부의 backend:8080 으로 프록시한다.
#   - backend / postgres / redis / ai 는 어떤 호스트 포트도 열지 않는다 (내부 통신 전용).
#     → Docker 의 UFW 우회 문제(publish 시 iptables 직접 조작) 자체를 만들지 않는다.
#
# ⚠️ 이 서버에는 SSAFY Gerrit(8988/8989/29418)이 함께 돈다. caddy 는 80/443 만 쓰므로
#    충돌하지 않지만, 포트를 추가할 때 8988/8989/29418 을 절대 점유하지 않는다.

services:
  caddy:
    image: caddy:2-alpine
    container_name: vintib-caddy
    restart: unless-stopped
    ports:
      # ⚠️ 80 을 발행하지 않는다 (JY012). 그 포트는 LiveKit 미디어 TCP 가 쓴다 —
      #    SSAFY 상위 방화벽이 여는 포트가 22·80·443·8989 뿐이라 미디어에 내줄 것이 80 밖에 없다.
      #    대가로 http:// → https:// 자동 리다이렉트가 사라지고, ACME 는 HTTP-01 대신
      #    TLS-ALPN-01(443)을 쓴다 — Caddyfile 에 명시해 뒀다. 그걸 빼면 갱신 시점에
      #    조용히 실패해 인증서가 만료되고 사이트가 통째로 죽는다.
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      # ⚠️ 파일 하나가 아니라 **디렉터리**를 마운트한다.
      #
      # 리눅스에서 파일 단위 bind mount 는 그 시점의 inode 에 묶인다. 배포 때 rsync 가
      # 임시 파일에 쓴 뒤 rename 하면 **새 inode** 가 되는데, 컨테이너는 여전히 옛 inode 를
      # 보고 있어서 `caddy reload` 를 해도 옛 설정을 다시 읽는다. 그래서 Caddyfile 을 고쳐
      # 배포해도 반영되지 않았다(-514).
      #
      # 디렉터리를 마운트하면 파일은 열 때마다 새로 해석되므로 rename 교체가 그대로 보인다.
      # Caddy 의 기본 설정 경로가 /etc/caddy/Caddyfile 이라 command 는 바꿀 필요가 없다.
      - ./infra/caddy:/etc/caddy:ro
      - caddy-data:/data      # 발급받은 인증서 영속화 (Let's Encrypt 레이트리밋 회피)
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      livekit:
        # ⚠️ service_healthy 로 두면 안 된다. 미디어 서버가 뜨지 못했을 때 Caddy 까지
        #    기동을 멈춰 **사이트 전체가 죽는다.** 영상이 안 되는 것과 서비스가 통째로
        #    내려가는 것은 전혀 다른 문제다.
        #    started 로 두면 컨테이너만 생겨 DNS 가 잡히고, livekit 이 죽어 있으면
        #    /rtc 요청만 502 가 된다.
        condition: service_started
      # ⚠️ frontend 도 service_started 로만 (service_healthy 금지). FE 가 죽어도
      #    Caddy 는 떠 있어야 API·이미지·영상이 안 죽는다. FE 만 502 가 된다.
      frontend:
        condition: service_started
    networks:
      - vintib-net
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # FE 정적 서빙 (Caddy 뒤). build: ./FE 로 이미지 빌드 → nginx 가 dist 서빙.
  # 호스트 포트는 열지 않는다 (Caddy 만 접근). Caddy catch-all 이 frontend:80 으로 온다.
  frontend:
    build:
      context: ./FE
    image: vintib-frontend:${IMAGE_TAG:-local}
    container_name: vintib-frontend
    restart: unless-stopped
    networks:
      - vintib-net
    mem_limit: 256m
    healthcheck:
      # localhost 는 IPv6(::1)로 붙는데 nginx 는 IPv4(0.0.0.0:80)만 들어서 실패 → 127.0.0.1 로.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ⚠️ 이 파일에서 호스트 포트를 여는 유일한 예외다.
  #
  # WebRTC 미디어는 Caddy 를 통과할 수 없다 — TCP 리버스 프록시가 아니라 브라우저와
  # 서버가 직접 주고받는 UDP 스트림이기 때문이다. 그래서 미디어 포트만은 호스트에 발행한다.
  #
  # Docker 는 publish 시 iptables 를 직접 조작해 UFW 를 우회하므로 이 두 포트는 UFW 규칙과
  # 무관하게 외부에 열린다. **이건 실수가 아니라 의도다** — 시청자가 어디서든 붙어야 한다.
  # 시그널링(7880)은 발행하지 않는다. Caddy 가 /rtc·/twirp 만 프록시한다.
  livekit:
    environment:
      # ⚠️ **EC2 공인 IP 를 반드시 채운다.** 비우면 컨테이너 사설 IP(172.x)를 ICE 후보로
      #    뿌려서 브라우저가 미디어에 붙지 못한다 — 방송 화면이 검게 나오고 에러는 안 난다.
      #    설정 파일이 use_external_ip: false 라 STUN 자동 탐지도 하지 않는다(의도).
      NODE_IP: ${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP 가 필요하다 - EC2 공인 IP 를 .env 에 넣어라}
    ports:
      # ⚠️ 미디어 TCP 를 80 으로 받는다 (JY012). SSAFY 상위 방화벽이 TCP 22·80·443·8989 만
      #    통과시켜, 7881 은 UFW·호스트가 열려 있어도 패킷이 도달하지 못한다.
      #    컨테이너 안쪽도 80 이어야 한다 — LiveKit 이 설정의 tcp_port 를 그대로 ICE 후보로
      #    광고하기 때문이다(livekit.yaml 주석 참고). 그래서 caddy 는 80 을 비워 뒀다.
      - "80:80"           # 미디어 TCP (상위 방화벽이 여는 유일한 포트)
      # 상위에서 UDP 가 전부 막혀 지금은 쓰이지 않는다. SSAFY 가 열어 주면 그 즉시 살아나도록
      # 발행만 남긴다 — 클라이언트는 UDP 를 먼저 시도하고 실패하면 위 TCP 로 넘어간다.
      - "7885:7885/udp"   # 미디어 (UDP mux) — 현재 상위 방화벽에서 차단됨
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    # 운영에서는 호스트 포트를 열지 않는다 (caddy 가 앞단). base 의 포트 미publish 를 그대로 둔다.
    environment:
      SPRING_PROFILES_ACTIVE: prod
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 호스트 포트를 열지 않는다. 외부 접근은 caddy 가 /vintib-public·/vintib-private
  # 경로를 프록시하는 경로로만 이뤄진다 (override.yml 의 9000/9001 발행은 로컬 전용).
  minio:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ai:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:
